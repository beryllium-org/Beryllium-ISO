# Beryllium OS dracut configuration.
# Used on the installed system after Bakery swaps the target away from
# mkinitcpio. The ISO live boot itself still uses mkinitcpio + archiso.

# Generic image, not host-tuned (Bakery deploys to many SBC boards).
hostonly="no"
hostonly_cmdline="no"

# Plymouth boot splash.
add_dracutmodules+=" plymouth "

# Trim modules unused on Beryllium SBC targets.
omit_dracutmodules+=" iscsi nfs nbd "

# gzip is the safe default across all supported kernels and bootloaders.
compress="gzip"

# Match the existing initramfs filename so GRUB entries stay valid after
# the swap. Bakery still invokes dracut with an explicit --kver.
# (Outfile is overridden per-call by Bakery.)
